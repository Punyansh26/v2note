[project]
name = "v2note"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "punyansh26", email = "punyansh2005@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "psycopg>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
    "sqlmodel>=0.0.48",
    "uvicorn>=0.54.0",
]

[project.scripts]
v2note = "v2note:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
